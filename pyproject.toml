[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-calculator"
version = "0.1.0"
description = "A simple Python CLI calculator with arithmetic operations."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }

[project.scripts]
cli-calculator = "cli:main"

[tool.setuptools]
py-modules = ["calculator_logic", "cli"]
